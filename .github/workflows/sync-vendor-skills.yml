name: Sync vendor skills

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Run skills update (project scope)
        working-directory: synced-vendor-skills
        run: npx skills update -y -p

      - name: Prune extra agent skill links
        run: bash scripts/prune-synced-vendor-agent-skills.sh

      - name: Open pull request when lock or skills change
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "[FEATURE] Refresh synced vendor skills (automated)"
          title: "[FEATURE] Refresh synced vendor skills (automated)"
          body: |
            Automated run of `npx skills update -y -p` in `synced-vendor-skills/`, then `scripts/prune-synced-vendor-agent-skills.sh` so only `.agents/skills/` is committed (the CLI otherwise adds symlink stubs for every agent in CI). Plugin `rules/` and `skills/` symlinks are version-controlled and do not need updating when skills change.

            Review `synced-vendor-skills/.agents/skills/` and `synced-vendor-skills/skills-lock.json`, then merge.
          branch: feature/sync-vendor-skills
          delete-branch: true
